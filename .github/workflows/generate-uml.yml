name: Generate UML diagrams

on:
  push:
    branches:
      - main
    paths:
      - '**/*.cpp'
      - '.clang-uml'
      - 'CMakeLists.txt'
      - '.github/workflows/generate-uml.yml'
      - '.github/puppeteer-config.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang-uml
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:bkryza/clang-uml
          sudo apt-get update
          sudo apt-get install -y clang-uml cmake g++

      - name: Configure and build examples
        run: |
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate diagrams
        run: |
          clang-uml --progress -g mermaid --query-driver /usr/bin/c++
          npx --yes --package @mermaid-js/mermaid-cli@11.4.2 mmdc \
            -p .github/puppeteer-config.json \
            -i build/uml/notification_factory.mmd \
            -o Creational_pattern/Factory_Pattern/Factory_Design_Pattern.svg
          npx --yes --package @mermaid-js/mermaid-cli@11.4.2 mmdc \
            -p .github/puppeteer-config.json \
            -i build/uml/payment_factory.mmd \
            -o Creational_pattern/Factory_Pattern/Payment_Factory_Design_Pattern.svg

      - name: Commit generated diagrams
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update generated UML diagrams"
          file_pattern: Creational_pattern/Factory_Pattern/*.svg
